name: CI

on:
  push:
    # Pushes to dev are covered by nightly.yml, which gates publishing on the
    # same checks; running them here too would double every dev push.
    branches: [main]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  # Build, vet, database-backed tests, race detector, govulncheck, generated
  # code and lint; shared with nightly.yml and release.yml.
  checks:
    uses: ./.github/workflows/checks.yml

  migration-lines:
    name: Check migration lines
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check migration lines
        env:
          MIGRATION_BASE: ${{ github.event_name == 'push' && github.event.before || 'origin/main' }}
        run: ./script/check-migration-lines.sh
