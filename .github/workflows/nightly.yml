name: Nightly

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ppanel-dev-nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ppanel-server

jobs:
  # Nothing is published unless these pass. ci.yml deliberately skips pushes to
  # dev so the checks run once per push instead of twice.
  verify:
    if: github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/checks.yml

  publish:
    name: Publish nightly
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve build metadata
        id: meta
        run: |
          ./script/image-release.sh "$GITHUB_REF" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build binaries
        run: make linux-amd64 linux-arm64 VERSION=${{ steps.meta.outputs.version }} CHANNEL=nightly BUILD_TIME="$BUILD_TIME"

      - name: Publish nightly image
        uses: ./.github/actions/publish-image
        with:
          version: ${{ steps.meta.outputs.version }}
          channel: ${{ steps.meta.outputs.channel }}
          build-time: ${{ env.BUILD_TIME }}
          tags: ${{ steps.meta.outputs.tags }}
          docker-username: ${{ secrets.DOCKER_USERNAME }}
          docker-password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Publish the rolling nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Nightly $VERSION" \
            --notes "Untested-in-production build from \`dev\` at \`$VERSION\`, built ${{ env.BUILD_TIME }}.

          Container images (linux/amd64): \`ppanel/ppanel-server:nightly-$VERSION\` and \`ghcr.io/${{ github.repository_owner }}/ppanel-server:nightly-$VERSION\`.

          Nightly builds apply database migrations automatically at boot, and a migration published here may still be renumbered before it reaches a stable release. Downgrading is not supported once a migration has run: the only rollback is restoring a database backup. Do not point this at production data." \
            bin/${{ env.IMAGE_NAME }}-linux-amd64 \
            bin/${{ env.IMAGE_NAME }}-linux-arm64
