name: Performance

on:
  pull_request:
    branches: ["master", "main", "dev"]
    paths:
      - "internal/**"
      - "pkg/httpx/**"
      - "scripts/perf/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/performance.yml"
  workflow_dispatch:
    inputs:
      bench_time:
        description: "Go benchmark benchtime, for example 1s, 3s, or 10s"
        required: false
        default: "3s"
      bench_count:
        description: "Number of benchmark repetitions"
        required: false
        default: "3"

permissions:
  contents: read

jobs:
  http-server-benchmark:
    name: HTTP server benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run benchmarks
        env:
          BENCH_TIME: ${{ github.event.inputs.bench_time }}
          BENCH_COUNT: ${{ github.event.inputs.bench_count }}
        run: |
          bash scripts/perf/bench.sh | tee benchmark.txt
          {
            echo "### HTTP server benchmarks"
            echo
            echo '```'
            cat benchmark.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: http-server-benchmark
          path: benchmark.txt
