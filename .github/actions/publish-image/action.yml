name: Publish PPanel image
description: Build once, push to Docker Hub and GHCR, and verify each remote tag.
inputs:
  version:
    description: Application version
    required: true
  channel:
    description: Application build channel
    required: true
  build-time:
    description: UTC build timestamp shared with the release binaries
    required: true
  tags:
    description: Space-separated tags from script/image-release.sh
    required: true
  docker-username:
    description: Docker Hub login with write access to ppanel/ppanel-server
    required: true
  docker-password:
    description: Docker Hub access token
    required: true
runs:
  using: composite
  steps:
    - name: Log in to Docker Hub
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: docker.io
        username: ${{ inputs.docker-username }}
        password: ${{ inputs.docker-password }}

    - name: Log in to GHCR
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Set up QEMU
      if: inputs.channel != 'nightly'
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Resolve registry references
      id: refs
      shell: bash
      env:
        IMAGE_TAGS: ${{ inputs.tags }}
      run: |
        owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
        read -ra tags <<< "$IMAGE_TAGS"
        {
          echo 'list<<EOF'
          for tag in "${tags[@]}"; do
            printf '%s\n' "docker.io/ppanel/ppanel-server:$tag" "ghcr.io/$owner/ppanel-server:$tag"
          done
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"

    - name: Build and push to both registries
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: Dockerfile
        platforms: ${{ inputs.channel == 'nightly' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
        push: true
        build-args: |
          VERSION=${{ inputs.version }}
          CHANNEL=${{ inputs.channel }}
          BUILD_TIME=${{ inputs.build-time }}
        tags: ${{ steps.refs.outputs.list }}

    - name: Verify both registries serve the built manifest
      shell: bash
      env:
        IMAGE_REFS: ${{ steps.refs.outputs.list }}
        EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        while IFS= read -r ref; do
          actual=$(docker buildx imagetools inspect --raw "$ref" | sha256sum | cut -d' ' -f1)
          if [[ "sha256:$actual" != "$EXPECTED_DIGEST" ]]; then
            echo "::error::$ref returned sha256:$actual, expected $EXPECTED_DIGEST"
            exit 1
          fi
          printf '%s %s\n' "$ref" "$EXPECTED_DIGEST"
        done <<< "$IMAGE_REFS"
